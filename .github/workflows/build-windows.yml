name: Build Windows x86_64

# Modelled on the Windows workflow of the WSJT-X repository, adapted to this
# tree. Windows is the platform WSJT-Z actually ships — upstream publishes
# win32 and win64 installers and nothing else — so this is the build that
# matters most here.
#
# Differences from the original, each because this tree differs:
#   * no pFUnit and no ctest — WSJT-Z wires no test suite into CMake;
#   * no WSJT_RELEASE_CHANNEL / WSJT_RC_NUMBER — the older set_build_type
#     module here takes the channel as a macro argument, not a cache variable;
#   * OmniRig is registered rather than pointed at. This tree calls
#     `dumpcpp -getfile {GUID}`, which resolves the COM class through the
#     registry and fails the configure step outright if OmniRig was never
#     installed, so installing it is not optional here.
#
# win32 is not built yet. It needs a second MSYS2 environment (MINGW32) and
# its own dependency set; adding it is a matrix entry, not a rewrite.

on:
  workflow_call:
    inputs:
      version:
        description: "Version string used in artifact names"
        required: true
        type: string
      hamlib_branch:
        description: "Hamlib branch to build"
        required: false
        type: string
        default: "4.7.0"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # windows-latest's git defaults to core.autocrlf=true, which rewrites
      # line endings on checkout. The working tree then differs from the index,
      # the version machinery reports the source as dirty, and the About box
      # shows a "-dirty" build nobody can identify.
      - name: Disable core.autocrlf before checkout
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: true
          install: >-
            git make tar
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-multimedia
            mingw-w64-x86_64-qt5-serialport
            mingw-w64-x86_64-qt5-svg
            mingw-w64-x86_64-qt5-tools
            mingw-w64-x86_64-qt5-websockets
            mingw-w64-x86_64-qt5-activeqt
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-portaudio
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-nsis
            autoconf automake libtool

      - name: Cache Hamlib
        id: hamlib-cache
        uses: actions/cache@v5
        with:
          path: hamlib-prefix
          key: hamlib-windows-${{ inputs.hamlib_branch }}-${{ hashFiles('.github/workflows/build-windows.yml') }}

      - name: Build Hamlib
        if: steps.hamlib-cache.outputs.cache-hit != 'true'
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          WORKSPACE=$(cygpath "${GITHUB_WORKSPACE}")
          git clone --depth 1 --branch "${{ inputs.hamlib_branch }}" \
            https://github.com/Hamlib/Hamlib.git hamlib-src
          cd hamlib-src
          ./bootstrap
          ./configure \
            --prefix="${WORKSPACE}/hamlib-prefix" \
            --enable-shared --disable-static \
            --without-cxx-binding \
            --without-readline \
            CFLAGS="-DNDEBUG -g -O2 -fdata-sections -ffunction-sections" \
            LDFLAGS="-Wl,--gc-sections"
          make -j$(nproc)
          make install-strip

      # CMakeLists.txt asks dumpcpp for the OmniRig COM class by GUID and
      # stops the configure with "You need to install OmniRig on this
      # computer" if the registry has no such class. So it is installed, not
      # merely downloaded.
      - name: Install OmniRig
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.dxatlas.com/OmniRig/Files/OmniRig.zip" -OutFile OmniRig.zip
          Expand-Archive -Path OmniRig.zip -DestinationPath omnirig-extract
          $setup = Get-ChildItem -Path omnirig-extract -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $setup) { throw "No installer found in OmniRig.zip" }
          Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/NORESTART' -Wait

      - name: Fix dumpcpp name (MSYS2 ships dumpcpp-qt5, CMake expects dumpcpp)
        run: ln -sf /mingw64/bin/dumpcpp-qt5.exe /mingw64/bin/dumpcpp.exe

      - name: Configure
        run: |
          WORKSPACE=$(cygpath "${GITHUB_WORKSPACE}")
          cmake -G "MSYS Makefiles" -S . -B build \
            -DCMAKE_PREFIX_PATH="${WORKSPACE}/hamlib-prefix" \
            -DCMAKE_Fortran_FLAGS="-fallow-argument-mismatch -std=legacy" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_BUILD_TYPE=Release \
            -DWSJT_SKIP_MANPAGES=ON \
            -DWSJT_GENERATE_DOCS=OFF \
            -Wno-dev

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Verify binary
        run: |
          file build/wsjtx.exe
          # The fork marker has to reach the binary, or a build of this fork
          # is indistinguishable from an official one at the only moment
          # anybody checks — when reporting a problem with it. Ask for the
          # exact marker, not merely for "-uaham": WSJT_FORK_TAG is a CMake
          # cache variable, so a build directory configured once keeps
          # reporting the marker it was configured with, and a substring test
          # waves that through.
          FORK_TAG=$(sed -nE 's/^[[:space:]]*set \(WSJT_FORK_TAG "([^"]*)".*/\1/p' CMakeLists.txt | head -1)
          if [ -n "$FORK_TAG" ]; then
            strings build/wsjtx.exe | grep -q -- "-${FORK_TAG}$" \
              || { echo "::error::The built binary does not report -${FORK_TAG}. WSJT_FORK_TAG did not reach it."; exit 1; }
            echo "  ok  binary reports -${FORK_TAG}"
          fi

      - name: Stage install
        run: |
          WORKSPACE=$(cygpath "${GITHUB_WORKSPACE}")
          cmake --install build --prefix "${WORKSPACE}/stage"
          ls -la "${WORKSPACE}/stage/bin"
          test -f "${WORKSPACE}/stage/bin/wsjtx.exe"
          test -f "${WORKSPACE}/stage/bin/jt9.exe"

      # CMakeLists.txt sets CPACK_GENERATOR=NSIS on WIN32 and builds the
      # package version out of the WSJT-X base and VERSION_Z. The override
      # keeps the filename identical to the version this workflow derived,
      # including the fork marker, which CMake's numeric-only VERSION cannot
      # carry on its own.
      - name: Package NSIS installer
        run: |
          cd build
          cpack -G NSIS -V \
            -D CPACK_PACKAGE_VERSION="${{ inputs.version }}" \
            -D CPACK_PACKAGE_FILE_NAME="wsjtz-${{ inputs.version }}-win64"
          ls -la *.exe

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: wsjtz-${{ inputs.version }}-win64-installer
          path: build/wsjtz-${{ inputs.version }}-win64.exe
          if-no-files-found: error
