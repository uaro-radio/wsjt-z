name: CI

# Windows and Linux. Windows is what WSJT-Z actually ships — upstream
# publishes win32 and win64 installers and nothing else — and Linux is here
# because the operators this fork is built for run both.
#
# macOS is absent: it needs Qt built from source and its own signing and
# bundling machinery, and upstream WSJT-Z has never published a macOS build to
# match against.

on:
  workflow_dispatch:
  push:
    branches: [feat/uaham-integration]

jobs:
  # One source of truth for the version string: read it from Versions.cmake,
  # with the fork marker from CMakeLists.txt appended, so an artifact of this
  # fork is never named as though it came from the WSJT-Z project.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: v
        run: |
          MAJOR=$(sed -nE 's/^[[:space:]]*set \(WSJTX_VERSION_MAJOR ([0-9]+)\).*/\1/p' Versions.cmake)
          MINOR=$(sed -nE 's/^[[:space:]]*set \(WSJTX_VERSION_MINOR ([0-9]+)\).*/\1/p' Versions.cmake)
          PATCH=$(sed -nE 's/^[[:space:]]*set \(WSJTX_VERSION_PATCH ([0-9]+)\).*/\1/p' Versions.cmake)
          if [ -z "$MAJOR" ] || [ -z "$MINOR" ] || [ -z "$PATCH" ]; then
            echo "::error::Could not derive the version from Versions.cmake"
            exit 1
          fi
          # WSJT-Z names its own releases <wsjtx base>-<mod version>, as in
          # wsjtz-3.0.0-2.0.18-win64.exe. Keeping both matters: the base says
          # which WSJT-X this descends from, the mod version says which WSJT-Z,
          # and dropping either leaves an operator unable to say what they are
          # running. The fork marker goes on the end.
          VERSION_Z=$(sed -nE 's/^[[:space:]]*set \(VERSION_Z "([^"]*)".*/\1/p' CMakeLists.txt | head -1)
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          if [ -n "$VERSION_Z" ]; then
            VERSION="${VERSION}-${VERSION_Z}"
          fi
          FORK_TAG=$(sed -nE 's/^[[:space:]]*set \(WSJT_FORK_TAG "([^"]*)".*/\1/p' CMakeLists.txt | head -1)
          if [ -n "$FORK_TAG" ]; then
            VERSION="${VERSION}-${FORK_TAG}"
          fi
          echo "Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  linux:
    needs: prepare
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.0"
      arch: "x86_64"

  linux-arm:
    needs: prepare
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.0"
      arch: "aarch64"

  windows:
    needs: prepare
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.0"
